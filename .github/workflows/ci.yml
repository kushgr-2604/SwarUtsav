name: SwarUtsav checks
on:
  push:
    branches:
      - main
      - feature/secure-voice-screen-interviews
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API and media tests
        env:
          PYTHONPATH: backend
          APP_ENV: test
          JWT_SECRET: github-actions-only-long-random-test-secret-12345
          DATABASE_PATH: /tmp/swarutsav-test.sqlite3
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build React frontend
        env:
          CI: "false"
        run: npm run build --prefix frontend
