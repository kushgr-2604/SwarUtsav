services:
  backend:
    build: { context: ./backend }
    container_name: swarutsav-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      DATABASE_PATH: /data/swarutsav.db
      FRONTEND_URL: http://localhost:3000
      API_V1_PREFIX: /api/v1
    ports: ["8000:8000"]
    volumes: [swarutsav-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args: { REACT_APP_API_URL: http://localhost:8000/api/v1 }
    container_name: swarutsav-web
    ports: ["3000:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
volumes:
  swarutsav-data:
